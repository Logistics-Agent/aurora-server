syntax = "proto3";

package billing;

option csharp_namespace = "BillingService.Grpc";

service BillingService {
  // Invoice operations
  rpc GenerateInvoice(GenerateInvoiceRequest) returns (InvoiceResponse);
  rpc GetInvoiceDetail(GetInvoiceRequest) returns (InvoiceDetailResponse);
  rpc CheckCustomerCredit(CreditCheckRequest) returns (CreditCheckResponse);
  rpc CreateInvoice(CreateInvoiceRequest) returns (InvoiceResponse);
  rpc GetInvoice(GetInvoiceRequest) returns (InvoiceResponse);
  rpc ListInvoices(ListInvoicesRequest) returns (ListInvoicesResponse);
  rpc UpdateInvoiceStatus(UpdateInvoiceStatusRequest) returns (InvoiceResponse);
      
  // Escrow Wallet operations
  rpc CreateEscrowWallet(CreateEscrowWalletRequest) returns (WalletResponse);
  rpc GetWalletBalance(GetWalletBalanceRequest) returns (WalletResponse);
  rpc FreezeEscrowAmount(FreezeEscrowRequest) returns (TransactionResponse);
  rpc ReleaseEscrowAmount(ReleaseEscrowRequest) returns (TransactionResponse);
  rpc RefundEscrowAmount(RefundEscrowRequest) returns (TransactionResponse);
}

// ── Invoice Messages ─────────────────────────────────────────────────────────

message GenerateInvoiceRequest {
  string tenantId = 1;
  string shipmentId = 2;
  string customerId = 3;
  int32 paymentTermsDays = 4; // Default e.g. 30 (T+30)
}

message CreditCheckRequest {
  string tenantId = 1;
  string customerId = 2;
  double newAmount = 3;
}

message CreditCheckResponse {
  string customerId = 1;
  bool isCreditApproved = 2;
  double creditLimit = 3;
  double currentOutstandingDebt = 4;
  double availableCredit = 5;
  int32 overdueInvoiceCount = 6;
  string message = 7;
}

message InvoiceLineItemInput {
  string description = 1;
  double amount = 2;
  int32 quantity = 3;
  double unitPrice = 4;
  string category = 5; // FREIGHT, PORT_FEE, CUSTOMS_DUTY
}

message CreateInvoiceRequest {
  string tenantId = 1;
  string shipmentId = 2;
  string customerId = 3;
  repeated InvoiceLineItemInput items = 4;
  string dueDate = 5;
}

message GetInvoiceRequest {
  string invoiceId = 1;
}

message ListInvoicesRequest {
  string tenantId = 1;
  int32 page = 2;
  int32 limit = 3;
  optional string status = 4;
}

message InvoiceLineItemMessage {
  string id = 1;
  string description = 2;
  int32 quantity = 3;
  double unitPrice = 4;
  double amount = 5;
  string category = 6;
}

message PaymentRecordMessage {
  string id = 1;
  double amountPaid = 2;
  string paymentMethod = 3;
  string transactionRef = 4;
  string status = 5;
  string createdAt = 6;
}

message InvoiceResponse {
  string id = 1;
  string tenantId = 2;
  string shipmentId = 3;
  string customerId = 4;
  string invoiceNumber = 5;
  double subtotal = 6;
  double taxAmount = 7;
  double totalAmount = 8;
  string currency = 9;
  string status = 10; // UNPAID, PARTIALLY_PAID, PAID, CANCELLED, OVERDUE
  string dueDate = 11;
  string pdfS3Key = 12;
  string pdfUrl = 13;
  string createdAt = 14;
  repeated InvoiceLineItemMessage items = 15;
}

message InvoiceDetailResponse {
  InvoiceResponse invoice = 1;
  repeated PaymentRecordMessage payments = 2;
  double remainingBalance = 3;
}

message ListInvoicesResponse {
  repeated InvoiceResponse invoices = 1;
  int32 totalItems = 2;
  int32 page = 3;
  int32 limit = 4;
}

message UpdateInvoiceStatusRequest {
  string invoiceId = 1;
  string status = 2;
}

// ── Escrow Messages ──────────────────────────────────────────────────────────

message CreateEscrowWalletRequest {
  string tenantId = 1;
  string carrierId = 2;
  string currency = 3;
}

message GetWalletBalanceRequest {
  string walletId = 1;
}

message WalletResponse {
  string walletId = 1;
  string tenantId = 2;
  string carrierId = 3;
  double balance = 4;
  double frozenAmount = 5;
  double availableAmount = 6;
  string currency = 7;
}

message FreezeEscrowRequest {
  string walletId = 1;
  string shipmentId = 2;
  double amount = 3;
  string referenceNo = 4;
}

message ReleaseEscrowRequest {
  string walletId = 1;
  string shipmentId = 2;
  double amount = 3;
  string referenceNo = 4;
}

message RefundEscrowRequest {
  string walletId = 1;
  string shipmentId = 2;
  double amount = 3;
  string referenceNo = 4;
}

message TransactionResponse {
  string transactionId = 1;
  string walletId = 2;
  string shipmentId = 3;
  string type = 4; // FREEZE, RELEASE, REFUND, DEPOSIT
  double amount = 5;
  string status = 6; // SUCCESS, PENDING, FAILED
  string referenceNo = 7;
  string createdAt = 8;
}
