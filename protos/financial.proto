syntax = "proto3";

package financial;

option csharp_namespace = "FinancialService.Grpc";

service FinancialService {
  rpc EstimateCost(EstimateCostRequest) returns (EstimateCostResponse);
  rpc GetCustomsDuty(GetCustomsDutyRequest) returns (GetCustomsDutyResponse);
  rpc GetMinAcceptableRate(GetMinAcceptableRateRequest) returns (GetMinAcceptableRateResponse);
  rpc GetDynamicMargin(GetDynamicMarginRequest) returns (GetDynamicMarginResponse);
  rpc GetExchangeRate(GetExchangeRateRequest) returns (GetExchangeRateResponse);
  rpc CreateQuote(CreateQuoteRequest) returns (CommercialQuoteDto);
  rpc ListQuotes(ListQuotesRequest) returns (ListQuotesResponse);
  rpc RegisterShipmentThread(RegisterShipmentThreadRequest) returns (CommercialQuoteDto);
  rpc ConfirmQuote(ConfirmQuoteRequest) returns (CommercialQuoteDto);
}
                
message EstimateCostRequest {
  string originCountry = 1;
  string originPort = 2;
  string destinationCountry = 3;
  string destinationPort = 4;
  double weightKg = 5;
  double volumeCbm = 6;
  double lengthCm = 7;
  double widthCm = 8;
  double heightCm = 9;
  string transportMode = 10; // AIR, SEA, ROAD
  string cargoType = 11;
  double cargoValue = 12;
  string currency = 13;
  repeated string hsCodes = 14;
  double fscRatePercent = 15;
  double ebsRatePercent = 16;
  double insuranceRatePercent = 17;
}

message EstimateCostResponse {
  double baseFreightCost = 1;
  double portHandlingFees = 2;
  double importDutyFee = 3;
  double vatFee = 4;
  double totalCustomsFee = 5;
  double totalEstimatedCost = 6;
  double chargeableWeightKg = 7;
  double volumetricWeightKg = 8;
  string currency = 9;
  string calculationMethod = 10;
  string description = 11;
  double fuelSurchargeFee = 12;
  double cargoInsuranceFee = 13;
}

message GetCustomsDutyRequest {
  string originCountry = 1;
  string destinationCountry = 2;
  string hsCode = 3;
  double cargoValue = 4;
}

message GetCustomsDutyResponse {
  string hsCode = 1;
  double importTaxRate = 2;
  double vatRate = 3;
  double importDutyAmount = 4;
  double vatAmount = 5;
  double totalTaxAmount = 6;
  string description = 7;
}

message GetMinAcceptableRateRequest {
  string originPort = 1;
  string destinationPort = 2;
  string transportMode = 3;
  double weightKg = 4;
  double volumeCbm = 5;
  string cargoType = 6;
  double minMarginPercent = 7;
  double targetMarginPercent = 8;
}

message GetMinAcceptableRateResponse {
  double costPrice = 1;
  double minAcceptableRate = 2;
  double targetRate = 3;
  string currency = 4;
  string breakdownNote = 5;
}

message GetDynamicMarginRequest {
  string shipmentId = 1;
  double costPrice = 2;
  double baseMarginPercent = 3;
  double remainingSeconds = 4;
  double totalSeconds = 5;
  double gamma = 6;
}

message GetDynamicMarginResponse {
  double costPrice = 1;
  double listPrice = 2;
  double minAcceptablePrice = 3;
  double currentMarginPercent = 4;
  double decayFactor = 5;
  string currency = 6;
  string note = 7;
}

message GetExchangeRateRequest {
  string fromCurrency = 1;
  string toCurrency = 2;
  string date = 3;
}

message GetExchangeRateResponse {
  string fromCurrency = 1;
  string toCurrency = 2;
  double rate = 3;
  string validDate = 4;
  string source = 5;
}


message CommercialQuoteDto {
  string id = 1;
  string tenant_id = 2;
  string source_thread_id = 3;
  string shipment_id = 4;
  string customer_id = 5;
  string origin_country = 6;
  string origin_port = 7;
  string destination_country = 8;
  string destination_port = 9;
  double weight_kg = 10;
  double volume_cbm = 11;
  string transport_mode = 12;
  string cargo_type = 13;
  double cargo_value = 14;
  repeated string hs_codes = 15;
  double base_freight_cost = 16;
  double port_handling_fees = 17;
  double fuel_surcharge_fee = 18;
  double cargo_insurance_fee = 19;
  double total_customs_fee = 20;
  double cost_price = 21;
  double min_acceptable_rate = 22;
  double target_rate = 23;
  string currency = 24;
  string calculation_method = 25;
  string description = 26;
  string status = 27;
  string created_at = 28;
  string updated_at = 29;
  string route_id = 30;
  string route_name = 31;
  double distance_km = 32;
  double agreed_price = 33;
}

message CreateQuoteRequest {
  string tenant_id = 1;
  string source_thread_id = 2;
  string shipment_id = 3;
  string customer_id = 4;
  string origin_country = 5;
  string origin_port = 6;
  string destination_country = 7;
  string destination_port = 8;
  double weight_kg = 9;
  double volume_cbm = 10;
  string transport_mode = 11;
  string cargo_type = 12;
  double cargo_value = 13;
  string currency = 14;
  repeated string hs_codes = 15;
  double fsc_rate_percent = 16;
  double ebs_rate_percent = 17;
  double insurance_rate_percent = 18;
  double min_margin_percent = 19;
  double target_margin_percent = 20;
  string route_id = 21;
  string route_name = 22;
  double distance_km = 23;
}

message ListQuotesRequest {
  string tenant_id = 1;
  string source_thread_id = 2;
  string shipment_id = 3;
  string quote_id = 4;
}

message ListQuotesResponse {
  repeated CommercialQuoteDto quotes = 1;
}

message RegisterShipmentThreadRequest {
  string tenant_id = 1;
  string shipment_id = 2;
  string source_thread_id = 3;
  string customer_id = 4;
  string origin_port = 5;
  string destination_port = 6;
  double weight_kg = 7;
  double volume_cbm = 8;
  string transport_mode = 9;
}

message ConfirmQuoteRequest {
  string tenant_id = 1;
  string quote_id = 2;
  string shipment_id = 3;
  double agreed_price = 4;
}
