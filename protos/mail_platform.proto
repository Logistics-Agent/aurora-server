syntax = "proto3";

// ==============================================================================
// Aurora Mail Platform — gRPC Contract Specification
// Version: 1.0.0 (Frozen Contract)
//
// PROTOBUF VERSIONING & COMPATIBILITY RULES:
// 1. Never renumber existing fields.
// 2. Never reuse removed field numbers.
// 3. New fields must be additive (optional) with new distinct field numbers.
// 4. Do not alter enum numeric values.
// 5. Breaking RPC changes require a new RPC method or package version (e.g. mail.v2).
// ==============================================================================
    
package mail;
option csharp_namespace = "MailService.GrpcServices";

import "google/protobuf/timestamp.proto";

// ─── Management Service ────────────────────────────────────────────────────

service MailManagement {
  rpc ProvisionDomain      (ProvisionDomainRequest)      returns (ProvisionDomainResponse);
  rpc CreateMailbox        (CreateMailboxRequest)         returns (CreateMailboxResponse);
  rpc CreateAlias          (CreateAliasRequest)           returns (CreateAliasResponse);
  rpc ResetPassword        (ResetPasswordRequest)         returns (ResetPasswordResponse);
  rpc GetAuditRecords      (GetAuditRecordsRequest)       returns (GetAuditRecordsResponse);
  rpc RequeueDeadLetter    (RequeueDeadLetterRequest)     returns (RequeueDeadLetterResponse);
}

// ─── Security / Pipeline Service ──────────────────────────────────────────

service MailSecurity {
  rpc CreateDraftMessage     (CreateDraftMessageRequest)      returns (CreateDraftMessageResponse);
  rpc ListDrafts             (ListDraftsRequest)              returns (ListDraftsResponse);
  rpc GetDraft               (GetDraftRequest)                returns (DraftDto);
  rpc SubmitOutboundMessage  (SubmitOutboundMessageRequest)   returns (SubmitOutboundMessageResponse); // Requires Staff or Tenant_Admin JWT role
  rpc GetProcessedMessage    (GetProcessedMessageRequest)     returns (ProcessedMessageDto);
  rpc ListProcessedMessages  (ListProcessedMessagesRequest)   returns (ListProcessedMessagesResponse);
  rpc GetQuarantineRecord    (GetQuarantineRecordRequest)     returns (QuarantineRecordDto);
  rpc ListQuarantineRecords  (ListQuarantineRecordsRequest)   returns (ListQuarantineRecordsResponse);
  rpc ReleaseQuarantine      (ReleaseQuarantineRequest)       returns (ReleaseQuarantineResponse);
  rpc DeleteQuarantine       (DeleteQuarantineRequest)        returns (DeleteQuarantineResponse);
  rpc GetThread              (GetThreadRequest)               returns (ThreadDto);
  rpc ListThreads            (ListThreadsRequest)             returns (ListThreadsResponse);
  rpc ClaimThread            (ClaimThreadRequest)             returns (ClaimThreadResponse);
  rpc ReassignThread         (ReassignThreadRequest)          returns (ReassignThreadResponse);
  rpc UnassignThread         (UnassignThreadRequest)          returns (UnassignThreadResponse);
  rpc GetThreadAssignmentHistory (GetThreadAssignmentHistoryRequest) returns (GetThreadAssignmentHistoryResponse);
}

// ─── Management Messages ──────────────────────────────────────────────────

message ProvisionDomainRequest {
  string domain_name       = 1;  // FQDN, required
  int32  max_mailbox_count = 2;  // default 100
  int32  retention_days    = 3;  // default 365
}

message ProvisionDomainResponse {
  string domain_id        = 1;
  string domain_name      = 2;
  string dkim_selector    = 3;
  string dkim_txt_record  = 4;   // value to publish as DNS TXT
  google.protobuf.Timestamp provisioned_at = 5;
}

message CreateMailboxRequest {
  string domain_id  = 1;
  string local_part = 2;  // before @; required
  string user_id    = 3;  // IamTenant user reference; optional
}

message CreateMailboxResponse {
  string mailbox_id    = 1;
  string full_address  = 2;
  google.protobuf.Timestamp created_at = 3;
}

message CreateAliasRequest {
  string domain_id     = 1;
  string alias_address = 2;
  repeated string target_addresses = 3;
}

message CreateAliasResponse {
  string alias_id = 1;
  google.protobuf.Timestamp created_at = 2;
}

message ResetPasswordRequest {
  string mailbox_id = 1;
  // v1: no-op; authentication delegated to Cognito OIDC
}

message ResetPasswordResponse {
  bool acknowledged = 1;
  string message    = 2;  // "Password management delegated to Cognito OIDC in v1"
}

message GetAuditRecordsRequest {
  string resource_type = 1;   // optional filter
  string resource_id   = 2;   // optional filter
  string next_page_token = 3;
  int32  page_size       = 4; // max 100
}

message GetAuditRecordsResponse {
  repeated AuditRecordDto records = 1;
  string next_page_token          = 2;
}

message AuditRecordDto {
  string audit_id        = 1;
  string actor_id        = 2;
  string actor_type      = 3;
  string action          = 4;
  string resource_type   = 5;
  string resource_id     = 6;
  google.protobuf.Timestamp timestamp = 7;
  string result          = 8;
  string detail_json     = 9;
}

message RequeueDeadLetterRequest {
  string processed_message_id = 1;
}

message RequeueDeadLetterResponse {
  bool   success = 1;
  string message = 2;
}

// ─── Security / Pipeline Messages ─────────────────────────────────────────

message CreateDraftMessageRequest {
  string mailbox_id                  = 1;
  string assigned_staff_id           = 2; // optional
  string subject                     = 3;
  string body                        = 4;
  string source                      = 5; // "Manual" | "AiAgent"
  string source_type                 = 6; // optional, e.g. "NEGOTIATION" | "MANUAL"
  string source_id                   = 7; // optional, e.g. negotiation session ID
  string idempotency_key             = 8; // optional client idempotency key
  repeated string to_recipients      = 9; // optional recipient list
  string thread_id                   = 10; // optional existing thread ID
  string reply_to_message_id         = 11; // optional parent processed message ID
}

message CreateDraftMessageResponse {
  string draft_id                          = 1;
  string draft_root_id                     = 2;
  int32  revision_number                   = 3;
  google.protobuf.Timestamp created_at     = 4;
  string source_type                       = 5;
  string source_id                         = 6;
  bool   is_existing                       = 7; // true if returned by idempotency key
  string thread_id                         = 8;
  string reply_to_message_id               = 9;
  string status                            = 10; // "DRAFT"
}

message ListDraftsRequest {
  string mailbox_id         = 1; // optional filter
  string status             = 2; // "Draft" | "Sent" | "Discarded" | "" (all)
  string next_page_token    = 3;
  int32  page_size          = 4; // max 100, default 20
}

message ListDraftsResponse {
  repeated DraftDto drafts  = 1;
  string next_page_token    = 2;
}

message GetDraftRequest {
  string draft_id           = 1; // specific revision ID
}

message DraftDto {
  string draft_id             = 1;
  string draft_root_id        = 2;
  int32  revision_number      = 3;
  bool   is_latest_revision   = 4;
  string source               = 5;
  string status               = 6;
  string mailbox_id           = 7;
  string assigned_staff_id    = 8;
  string subject              = 9;
  string body                 = 10;
  string content_hash         = 11;
  google.protobuf.Timestamp created_at = 12;
  string source_type          = 13;
  string source_id            = 14;
  repeated string to_recipients = 15;
  string thread_id            = 16;
  string reply_to_message_id  = 17;
}

message SubmitOutboundMessageRequest {
  string sender_address            = 1;
  repeated string recipient_addresses = 2;
  string subject                   = 3;
  string body_text                 = 4;
  string body_html                 = 5;
  repeated AttachmentDto attachments = 6;
  string idempotency_key           = 7;  // caller-supplied; use MessageId from header if available
  optional string draft_root_id    = 8;  // nullable — absent means manually composed, no revision pre-check
  optional string sent_by_user_id  = 9;  // authenticated human actor
  optional string thread_id        = 10; // optional associated thread ID
  optional string reply_to_message_id = 11; // optional parent processed message ID
}

message AttachmentDto {
  string filename     = 1;
  string content_type = 2;
  bytes  content      = 3;
}

message SubmitOutboundMessageResponse {
  string processed_message_id = 1;
  string stalwart_queue_id    = 2;
  google.protobuf.Timestamp submitted_at = 3;
}

message GetProcessedMessageRequest {
  string processed_message_id = 1;
}

message ProcessedMessageDto {
  string processed_message_id = 1;
  string message_id           = 2;
  string direction            = 3;
  string sender_address       = 4;
  repeated string recipient_addresses = 5;
  string subject              = 6;
  google.protobuf.Timestamp received_at   = 7;
  google.protobuf.Timestamp processed_at  = 8;
  string email_category       = 9;
  string pipeline_status      = 10;
  double spam_score           = 11;
  double phishing_score       = 12;
  bool   is_quarantined       = 13;
  string r2_raw_eml_path      = 14;
  repeated SecurityCheckResultDto security_checks = 15;
  string thread_id            = 16;
  string reply_to_message_id  = 17;
  string body_text            = 18;
  string body_html            = 19;
}

message SecurityCheckResultDto {
  string stage       = 1;
  string result      = 2;
  string detail_json = 3;
  int32  duration_ms = 4;
}

message ListProcessedMessagesRequest {
  string direction        = 1;  // "Inbound" | "Outbound" | "" (all)
  string email_category   = 2;  // optional filter
  string pipeline_status  = 3;  // optional filter
  string next_page_token  = 4;  // cursor: base64(received_at:id)
  int32  page_size        = 5;  // max 100, default 20
}

message ListProcessedMessagesResponse {
  repeated ProcessedMessageDto messages = 1;
  string next_page_token                = 2;
}

message GetQuarantineRecordRequest {
  string quarantine_id = 1;
}

message QuarantineRecordDto {
  string quarantine_id          = 1;
  string processed_message_id   = 2;
  string message_id             = 3;
  string quarantine_reason      = 4;
  google.protobuf.Timestamp quarantined_at  = 5;
  string status                 = 6;
  string reviewed_by            = 7;
  google.protobuf.Timestamp reviewed_at     = 8;
}

message ListQuarantineRecordsRequest {
  string status           = 1;  // "Pending" | "Released" | "Deleted" | ""
  string next_page_token  = 2;
  int32  page_size        = 3;
}

message ListQuarantineRecordsResponse {
  repeated QuarantineRecordDto records = 1;
  string next_page_token               = 2;
}

message ReleaseQuarantineRequest {
  string quarantine_id = 1;
}

message ReleaseQuarantineResponse {
  bool   success = 1;
  google.protobuf.Timestamp released_at = 2;
}

message DeleteQuarantineRequest {
  string quarantine_id = 1;
}

message DeleteQuarantineResponse {
  bool success = 1;
}

// ─── Thread Messages (Gmail-Like Threading) ────────────────────────────────

message GetThreadRequest {
  string thread_id = 1;
}

message ListThreadsRequest {
  string mailbox_id      = 1; // optional filter
  string next_page_token = 2;
  int32  page_size       = 3; // max 100, default 20
  string scope           = 4; // "UNASSIGNED" | "MY_WORK" | "ALL" | ""
  string status          = 5; // optional "UNASSIGNED" | "IN_PROGRESS" | "WAITING_CUSTOMER" | "RESOLVED"
  string search          = 6; // optional keyword search in subject/snippet/participants
}

message ListThreadsResponse {
  repeated ThreadSummaryDto threads = 1;
  string next_page_token            = 2;
  bool   has_more                   = 3;
}

message ThreadSummaryDto {
  string thread_id                        = 1;
  string mailbox_id                       = 2;
  string subject                          = 3;
  repeated string participants            = 4;
  google.protobuf.Timestamp last_message_at = 5;
  int32  message_count                    = 6;
  int32  draft_count                      = 7;
  bool   has_unread                       = 8;
  string snippet                          = 9;
  string primary_assignee_user_id         = 10;
  google.protobuf.Timestamp assigned_at   = 11;
  string status                           = 12; // "UNASSIGNED" | "IN_PROGRESS" | "WAITING_CUSTOMER" | "RESOLVED"
  string priority                         = 13; // "NORMAL" | "HIGH" | "URGENT" | "LOW"
}

message ThreadDto {
  string thread_id                        = 1;
  string mailbox_id                       = 2;
  string subject                          = 3;
  repeated string participants            = 4;
  repeated ThreadMessageDto messages      = 5;
  repeated DraftDto drafts                = 6;
  google.protobuf.Timestamp created_at    = 7;
  google.protobuf.Timestamp updated_at    = 8;
  string primary_assignee_user_id         = 9;
  google.protobuf.Timestamp assigned_at   = 10;
  string status                           = 11;
  string priority                         = 12;
  repeated ThreadAssignmentHistoryDto assignment_history = 13;
}

message ThreadMessageDto {
  string message_id                       = 1;
  string direction                        = 2; // "Inbound" | "Outbound"
  string sender_address                   = 3;
  repeated string recipient_addresses     = 4;
  string subject                          = 5;
  string body_text                        = 6;
  string body_preview                     = 7;
  string reply_to_message_id              = 8;
  google.protobuf.Timestamp received_at   = 9;
  google.protobuf.Timestamp sent_at       = 10;
}

message ClaimThreadRequest {
  string thread_id = 1;
}

message ClaimThreadResponse {
  bool   success                  = 1;
  string thread_id                = 2;
  string primary_assignee_user_id = 3;
  google.protobuf.Timestamp assigned_at = 4;
  string status                   = 5;
}

message ReassignThreadRequest {
  string thread_id      = 1;
  string target_user_id = 2;
  string reason         = 3;
}

message ReassignThreadResponse {
  bool   success                  = 1;
  string thread_id                = 2;
  string primary_assignee_user_id = 3;
  google.protobuf.Timestamp assigned_at = 4;
  string status                   = 5;
}

message UnassignThreadRequest {
  string thread_id = 1;
  string reason    = 2;
}

message UnassignThreadResponse {
  bool   success   = 1;
  string thread_id = 2;
  string status    = 3;
}

message GetThreadAssignmentHistoryRequest {
  string thread_id = 1;
}

message GetThreadAssignmentHistoryResponse {
  string thread_id                            = 1;
  repeated ThreadAssignmentHistoryDto history = 2;
}

message ThreadAssignmentHistoryDto {
  string id            = 1;
  string thread_id     = 2;
  string from_user_id  = 3;
  string to_user_id    = 4;
  string action        = 5; // "CLAIMED" | "ASSIGNED" | "REASSIGNED" | "UNASSIGNED"
  string actor_user_id = 6;
  string reason        = 7;
  google.protobuf.Timestamp created_at = 8;
}


