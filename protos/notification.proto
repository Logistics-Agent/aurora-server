syntax = "proto3";

option csharp_namespace = "Notification.Grpc";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

service NotificationService {
  rpc RegisterDevice(RegisterDeviceRequest) returns (DeviceResponse);
  rpc RemoveDevice(RemoveDeviceRequest) returns (google.protobuf.Empty);
  rpc SubscribeShipment(SubscribeShipmentRequest) returns (google.protobuf.Empty);
  rpc ListNotifications(ListNotificationsRequest) returns (ListNotificationsResponse);
  rpc GetUnreadCount(GetUnreadCountRequest) returns (UnreadCountResponse);
  rpc MarkNotificationRead(MarkNotificationReadRequest) returns (google.protobuf.Empty);
  rpc MarkAllNotificationsRead(MarkAllNotificationsReadRequest) returns (CountResponse);
}
  
message RegisterDeviceRequest {
  string token = 1;
  string platform = 2;
  string app_version = 3;
}

message DeviceResponse {
  string id = 1;
  string platform = 2;
  bool is_active = 3;
}

message RemoveDeviceRequest {
  string id = 1;
}

message SubscribeShipmentRequest {
  string shipment_id = 1;
}

message ListNotificationsRequest {
  int32 page = 1;
  int32 page_size = 2;
  bool unread_only = 3;
}

message ListNotificationsResponse {
  repeated NotificationResponse notifications = 1;
  int32 page = 2;
  int32 page_size = 3;
  int32 total_items = 4;
  int32 total_pages = 5;
}

message NotificationResponse {
  string id = 1;
  string shipment_id = 2;
  string event_type = 3;
  string channel = 4;
  string title = 5;
  string body = 6;
  bool is_read = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp read_at = 9;
  string shipment_number = 10;
  string action_url = 11;
}

message MarkNotificationReadRequest {
  string id = 1;
}

message GetUnreadCountRequest {}

message UnreadCountResponse {
  int32 count = 1;
}

message MarkAllNotificationsReadRequest {}

message CountResponse {
  int32 count = 1;
}
