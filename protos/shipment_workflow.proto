syntax = "proto3";

option csharp_namespace = "ShipmentWorkflow.Grpc";

import "google/protobuf/timestamp.proto";

service ShipmentWorkflowService {

    rpc CreateShipment(CreateShipmentRequest)
    returns (ShipmentResponse);

    rpc GetShipment(GetShipmentRequest)
    returns (ShipmentResponse);

    rpc ListShipments(ListShipmentsRequest)
    returns (ListShipmentsResponse);

    rpc UpdateShipmentStatus(UpdateShipmentStatusRequest)
    returns (ShipmentResponse);

    rpc GetShipmentTimeline(GetShipmentTimelineRequest)
    returns (ShipmentTimelineResponse);

    rpc CancelShipment(CancelShipmentRequest)
    returns (ShipmentResponse);
}

message CreateShipmentRequest {
  string orderId = 1;
  string customerName = 2;
  string originAddress = 3;
  string destinationAddress = 4;
  string originCountry = 5;
  string destinationCountry = 6;
  repeated CargoItemRequest cargoItems = 7;
}

message CargoItemRequest {
  string name = 1;
  int32 quantity = 2;
  double weightKg = 3;
  string hsCode = 4;
}

message ShipmentResponse {
  string id = 1;
  string tenantId = 2;
  string shipmentNo = 3;
  string orderId = 4;
  string customerName = 5;
  string originAddress = 6;
  string destinationAddress = 7;
  string originCountry = 8;
  string destinationCountry = 9;
  string status = 10;
  google.protobuf.Timestamp createdAt = 11;
  google.protobuf.Timestamp updatedAt = 12;
  repeated CargoItemResponse cargoItems = 13;
  string customerId = 14;
  string priority = 15;
  string transportMode = 16;
  string routeId = 17;
  string vehicleId = 18;
  google.protobuf.Timestamp estimatedPickupTime = 19;
  google.protobuf.Timestamp estimatedDeliveryTime = 20;
  google.protobuf.Timestamp actualPickupTime = 21;
  google.protobuf.Timestamp actualDeliveryTime = 22;
  string notes = 23;
  repeated ShipmentLocationResponse locations = 24;
  repeated ShipmentDocumentResponse documents = 25;
  repeated ShipmentMilestoneResponse milestones = 26;
}

message CargoItemResponse {
  string id = 1;
  string name = 2;
  int32 quantity = 3;
  double weightKg = 4;
  string hsCode = 5;
}

message ShipmentLocationResponse {
  string id = 1;
  string type = 2;
  string name = 3;
  string address = 4;
  double latitude = 5;
  double longitude = 6;
  string contactName = 7;
  string contactPhone = 8;
  int32 sequence = 9;
}

message ShipmentDocumentResponse {
  string id = 1;
  string fileName = 2;
  string documentType = 3;
  string storageUrl = 4;
  string ocrStatus = 5;
  double ocrConfidence = 6;
  string uploadedBy = 7;
  google.protobuf.Timestamp uploadedAt = 8;
  string extractedDataJson = 9;
}

message ShipmentMilestoneResponse {
  string id = 1;
  string status = 2;
  string description = 3;
  double latitude = 4;
  double longitude = 5;
  google.protobuf.Timestamp recordedAt = 6;
  string source = 7;
  string createdBy = 8;
}

message GetShipmentRequest {
  string id = 1;
}

message ListShipmentsRequest {
  int32 page = 1;
  int32 limit = 2;
  string status = 3;
  string shipmentNo = 4;
  string customerName = 5;
  google.protobuf.Timestamp createdFrom = 6;
  google.protobuf.Timestamp createdTo = 7;
}

message ListShipmentsResponse {
  repeated ShipmentResponse shipments = 1;
  int32 page = 2;
  int32 limit = 3;
  int32 totalItems = 4;
  int32 totalPages = 5;
}

message UpdateShipmentStatusRequest {
  string id = 1;
  string status = 2;
  string note = 3;
}

message GetShipmentTimelineRequest {
  string shipmentId = 1;
}

message ShipmentTimelineResponse {
  string shipmentId = 1;
  repeated ShipmentTimelineItem items = 2;
}

message ShipmentTimelineItem {
  string status = 1;
  string note = 2;
  google.protobuf.Timestamp createdAt = 3;
  string source = 4;
}

message CancelShipmentRequest {
  string id = 1;
  string reason = 2;
}
