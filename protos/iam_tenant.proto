syntax = "proto3";

package iam;

import "google/protobuf/timestamp.proto";
import "common.proto";
option csharp_namespace = "IamTenant.Grpc";

service IamService {
  // Tenant
  rpc CreateTenant(CreateTenantRequest)                              returns (TenantResponse);
  rpc GetTenant(GetTenantRequest)                                    returns (TenantResponse);
  rpc UpdateTenantStatus(UpdateTenantStatusRequest)                  returns (TenantResponse);
  rpc ListTenants(ListTenantsRequest)                                returns (ListTenantsResponse);
  rpc DeleteTenant(DeleteTenantRequest)                              returns (EmptyResponse);
  
// User Lifecycle   
  rpc InviteUser(InviteUserRequest)                                  returns (UserResponse);
  rpc GetUser(GetUserRequest)                                        returns (UserResponse);
  rpc GetManyUsers(GetManyUsersRequest)                              returns (GetManyUsersResponse);
  rpc UpdateUser(UpdateUserRequest)                                  returns (UserResponse);
  rpc ActivateUser(ActivateUserRequest)                              returns (UserResponse);
  rpc ResetUserPassword(ResetUserPasswordRequest)                    returns (EmptyResponse);
  rpc SuspendUser(SuspendUserRequest)                                returns (UserResponse);

  // User Persona Role (Single Base Role)
  rpc UpdateUserRole(UpdateUserRoleRequest)                          returns (UserRoleResponse);

  // Direct User Permissions (Capability Authority)
  rpc UpdateUserPermissions(UpdateUserPermissionsRequest)            returns (UserPermissionsResponse);
  rpc BulkUpdateUserPermissions(BulkUpdateUserPermissionsRequest)    returns (BulkUpdateUserPermissionsResponse);
  rpc GetUserPermissions(GetUserPermissionsRequest)                  returns (GetUserPermissionsResponse);
}

message EmptyResponse {}

//====================== TENANT ==========================//
message TenantResponse {
  string id = 1;
  string name = 2;
  string tenantCode = 3;
  common.PlanType planType = 4;
  common.TenantStatus status = 5;
  string adminEmail = 6;
  google.protobuf.Timestamp createdAt = 7;
  google.protobuf.Timestamp updatedAt = 8;
}

message CreateTenantRequest {
  string name = 1;
  string tenantCode = 2;
  string adminEmail = 3;
  string adminFirstName = 4;
  string adminLastName = 5;
  common.PlanType planType = 6;
  string companyDomain = 7;
}

message GetTenantRequest {
  oneof identifier {
    string id = 1;
    string tenantCode = 2;
  }
}

message UpdateTenantStatusRequest {
  string tenantId = 1;
  common.TenantStatus status = 2;
}

message ListTenantsRequest {
  int32 page = 1;
  int32 limit = 2;
}

message ListTenantsResponse {
  repeated TenantResponse tenants = 1;
  int32 page = 2;
  int32 limit = 3;
  int32 totalItems = 4;
  int32 totalPages = 5;
}

message DeleteTenantRequest {
  string id = 1;
}

//========================== USER =========================//
message UserResponse {
  string id = 1;
  string firstName = 2;
  string lastName = 3;
  string email = 4;
  string phoneNumber = 5;
  common.UserStatus status = 6;
  string role = 7; // SYSTEM_ADMIN | TENANT_ADMIN | MANAGER | STAFF
  repeated string permissions = 8;
  int32 permissionVersion = 9;
  google.protobuf.Timestamp createdAt = 10;
  google.protobuf.Timestamp updatedAt = 11;
  string tenantId = 12;
}

message InviteUserRequest {
  string firstName = 1;
  string lastName = 2;
  string email = 3;
  string phoneNumber = 4;
  string role = 5; // Default: STAFF. Strictly tenant roles (STAFF, MANAGER, TENANT_ADMIN).
  bool applyDefaultPermissions = 6;
  repeated string permissions = 7;
}

message UpdateUserRequest {
  string id = 1;
  string firstName = 2;
  string lastName = 3;
}

message ActivateUserRequest {
  string userId = 1;
}

message ResetUserPasswordRequest {
  string userId = 1;
}

message GetUserRequest {
  string id = 1;
}

message GetManyUsersRequest {
  int32 page = 1;
  int32 limit = 2;
  optional string role = 3;
  optional common.UserStatus status = 4;
}

message GetManyUsersResponse {
  repeated UserResponse users = 1;
  int32 page = 2;
  int32 limit = 3;
  int32 totalItems = 4;
  int32 totalPages = 5;
}

message SuspendUserRequest {
  string userId = 1;
  common.UserStatus status = 2;
}

//====================== USER ROLE UPDATE ========================//
message UpdateUserRoleRequest {
  string userId = 1;
  string newRole = 2; // STAFF | MANAGER | TENANT_ADMIN
  bool applyDefaultPermissions = 3;
}

message UserRoleResponse {
  string userId = 1;
  string role = 2;
  repeated string permissions = 3;
  int32 permissionVersion = 4;
  repeated string elevatedPermissionsRetained = 5; // On downgrade: warnings of elevated permissions retained
}

//======================= USER PERMISSIONS ========================//
message PermissionInfo {
  string id = 1;
  string code = 2;
  string module = 3;
  string description = 4;
}

message UpdateUserPermissionsRequest {
  string userId = 1;
  repeated string grant = 2;
  repeated string revoke = 3;
}

message UserPermissionsResponse {
  string userId = 1;
  string role = 2;
  repeated string permissions = 3;
  int32 permissionVersion = 4;
}

message BulkUpdateUserPermissionsRequest {
  repeated string userIds = 1;
  repeated string grant = 2;
  repeated string revoke = 3;
}

message BulkUpdateUserPermissionsResponse {
  int32 updatedUsersCount = 1;
  repeated string affectedUserIds = 2;
}

message GetUserPermissionsRequest {
  string userId = 1;
}

message GetUserPermissionsResponse {
  string userId = 1;
  string role = 2;
  repeated string permissions = 3;
  int32 permissionVersion = 4;
}