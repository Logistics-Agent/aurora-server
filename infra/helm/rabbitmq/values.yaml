# =============================================================================
# Upstream Bitnami RabbitMQ Values (Pinned Chart v14.4.1)
# =============================================================================

replicaCount: 1

auth:
  username: aurora_admin
  existingPasswordSecret: rabbitmq-credentials
  existingSecretPasswordKey: rabbitmq-password

persistence:
  enabled: true
  storageClass: "managed-csi"
  size: 8Gi

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

service:
  type: LoadBalancer
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
    service.beta.kubernetes.io/azure-load-balancer-internal-subnet: "snet-aks-core"
  ports:
    amqp: 5672
    dist: 25672
    manager: 15672
  loadBalancerIP: 10.10.2.50
