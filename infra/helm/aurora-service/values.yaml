# =============================================================================
# Aurora Service Universal Shared Helm Chart — Default Values
# =============================================================================

replicaCount: 1

strategy:
  type: Recreate

image:
  repository: acrauroracoredemo.azurecr.io/aurora/service-placeholder
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
  protocol: TCP
  name: http

# Optional secondary service port (e.g. gRPC or metrics)
additionalPorts: []

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

# Probes
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 12

# Non-secret environment variables (rendered in ConfigMap)
env: {}

# Environment variables from secrets
secretEnv: {}

# External Secrets Operator configuration (Azure Key Vault)
externalSecret:
  enabled: false
  secretStoreRef:
    name: azure-keyvault-store
    kind: ClusterSecretStore
  target:
    name: ""
    creationPolicy: Owner
  data: []

# Prometheus Operator ServiceMonitor
serviceMonitor:
  enabled: true
  interval: 15s
  scrapeTimeout: 10s
  path: /metrics
  port: http
  labels:
    release: kube-prometheus-stack

# PodDisruptionBudget
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# NetworkPolicy
networkPolicy:
  enabled: false

# Storage, Volumes and InitContainers
initContainers: []
volumes: []
volumeMounts: []
