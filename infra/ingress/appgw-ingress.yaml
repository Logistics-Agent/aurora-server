apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aurora-api-ingress
  namespace: aurora
  annotations:
    appgw.ingress.kubernetes.io/ssl-redirect: "false"
    appgw.ingress.kubernetes.io/backend-protocol: "http"
spec:
  ingressClassName: azure-application-gateway
  rules:
    - host: api.aurora-logistics.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
