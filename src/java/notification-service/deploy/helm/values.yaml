nameOverride: "notification"
fullnameOverride: "notification"

image:
  repository: acrauroracoredemo.azurecr.io/aurora/notification-service
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

env:
  SPRING_PROFILES_ACTIVE: "prod"
  SERVER_PORT: "8080"
  SPRING_RABBITMQ_HOST: "rabbitmq.aurora.svc.cluster.local"
  SPRING_RABBITMQ_PORT: "5672"
  SPRING_RABBITMQ_USERNAME: "aurora_admin"
  SPRING_REDIS_HOST: "redis-aurora-shared-demo.southeastasia.redis.azure.net"
  SPRING_REDIS_PORT: "10000"
  SPRING_REDIS_SSL: "true"

externalSecret:
  enabled: true
  secretStoreRef:
    name: azure-keyvault-store
    kind: ClusterSecretStore
  data:
    - secretKey: SPRING_DATASOURCE_URL
      remoteRef:
        key: notification-service-db-url
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef:
        key: notification-service-db-user
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: notification-service-db-password
    - secretKey: SPRING_RABBITMQ_PASSWORD
      remoteRef:
        key: rabbitmq-password
    - secretKey: SPRING_REDIS_PASSWORD
      remoteRef:
        key: redis-password
    - secretKey: TELEGRAM_BOT_TOKEN
      remoteRef:
        key: telegram-bot-token

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

serviceMonitor:
  enabled: true
  path: /actuator/prometheus
  port: http

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: http
  initialDelaySeconds: 20
  periodSeconds: 5
