server:
  port: 8086

grpc:
  server:
    port: 9086

spring:
  application:
    name: audit-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/aurora_shipment_workflow}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:aurora}
    password: ${SPRING_RABBITMQ_PASSWORD:aurora_dev}

app:
  rabbitmq:
    queue:
      audit-events: aurora.audit.events.queue
    exchange:
      audit: aurora.audit.events.exchange
    routing-key:
      audit: aurora.event.#
