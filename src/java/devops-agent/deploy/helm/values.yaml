nameOverride: "devops-agent"
fullnameOverride: "devops-agent"

image:
  repository: acrauroracorekhoa.azurecr.io/aurora/devops-agent
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

env:
  SPRING_PROFILES_ACTIVE: "prod"
  SERVER_PORT: "8080"
  SPRING_REDIS_HOST: "redis-master.aurora.svc.cluster.local"
  SPRING_REDIS_PORT: "6379"
  SPRING_REDIS_SSL: "false"

externalSecret:
  enabled: true
  secretStoreRef:
    name: azure-keyvault-store
    kind: ClusterSecretStore
  data:
    - secretKey: SPRING_DATASOURCE_URL
      remoteRef:
        key: devops-agent-db-url
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef:
        key: devops-agent-db-user
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: devops-agent-db-password
    - secretKey: SPRING_REDIS_PASSWORD
      remoteRef:
        key: redis-password
    - secretKey: GITHUB_TOKEN
      remoteRef:
        key: devops-github-token

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

serviceMonitor:
  enabled: true
  path: /actuator/prometheus
  port: http

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: http
  initialDelaySeconds: 20
  periodSeconds: 5

startupProbe:
  httpGet:
    path: /actuator/health/liveness
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 36