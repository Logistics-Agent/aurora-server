nameOverride: "ai-governance"
fullnameOverride: "ai-governance"

image:
  repository: acrauroracoredemo.azurecr.io/aurora/ai-governance
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

env:
  SPRING_PROFILES_ACTIVE: "prod"
  SERVER_PORT: "8080"
  SPRING_REDIS_HOST: "redis-aurora-shared-demo.southeastasia.redis.azure.net"
  SPRING_REDIS_PORT: "10000"
  SPRING_REDIS_SSL: "true"

externalSecret:
  enabled: true
  secretStoreRef:
    name: azure-keyvault-store
    kind: ClusterSecretStore
  data:
    - secretKey: SPRING_DATASOURCE_URL
      remoteRef:
        key: AI-Governance-DB
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef:
        key: ai-governance-db-user
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: ai-governance-db-password
    - secretKey: SPRING_REDIS_PASSWORD
      remoteRef:
        key: redis-password
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: openai-api-key
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: anthropic-api-key

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

serviceMonitor:
  enabled: true
  path: /actuator/prometheus
  port: http

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: http
  initialDelaySeconds: 20
  periodSeconds: 5
