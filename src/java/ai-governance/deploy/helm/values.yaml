nameOverride: "ai-governance"
fullnameOverride: "ai-governance"

image:
  repository: acrauroracorekhoa.azurecr.io/aurora/ai-governance
  tag: "latest"
  pullPolicy: IfNotPresent

env:
  SPRING_PROFILES_ACTIVE: "prod"
  SERVER_PORT: "8080"
  SPRING_REDIS_HOST: "redis-master.aurora.svc.cluster.local"
  SPRING_REDIS_PORT: "6379"
  SPRING_REDIS_SSL: "false"
  SPRING_RABBITMQ_HOST: "rabbitmq.aurora.svc.cluster.local"
  SPRING_RABBITMQ_PORT: "5672"
  SPRING_RABBITMQ_USERNAME: "aurora_admin"

externalSecret:
  enabled: true
  secretStoreRef:
    name: azure-keyvault-store
    kind: ClusterSecretStore
  data:
    - secretKey: SPRING_DATASOURCE_URL
      remoteRef:
        key: AI-Governance-DB
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef:
        key: ai-governance-db-user
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: ai-governance-db-password
    - secretKey: SPRING_REDIS_PASSWORD
      remoteRef:
        key: redis-password
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: openai-api-key
    - secretKey: SPRING_RABBITMQ_PASSWORD
      remoteRef:
        key: rabbitmq-password
resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 1Gi

serviceMonitor:
  enabled: true
  path: /actuator/prometheus
  port: http

service:
  type: ClusterIP
  port: 9090
  targetPort: 9090
  name: grpc

startupProbe:
  httpGet: null
  grpc:
    port: 9090
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 36

livenessProbe:
  httpGet: null
  grpc:
    port: 9090
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet: null
  grpc:
    port: 9090
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 6