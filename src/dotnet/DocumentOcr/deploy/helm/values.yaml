nameOverride: "document-ocr"
fullnameOverride: "document-ocr"

image:
  repository: acrauroracorekhoa.azurecr.io/aurora/document-ocr
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
    service.beta.kubernetes.io/azure-load-balancer-internal-subnet: "snet-aks-ai"
  loadBalancerIP: 10.20.2.11
  port: 5000
  targetPort: 5000

env:
  ASPNETCORE_ENVIRONMENT: "Production"
  RabbitMQ__Host: "rabbitmq.aurora.svc.cluster.local"
  RabbitMQ__Port: "5672"
  RabbitMQ__Username: "aurora_admin"
  AzureStorage__AccountName: "stauroradatademo"
  AzureStorage__ContainerName: "ocr-docs"
  Redis__Host: "redis-master.aurora.svc.cluster.local:6379"
  Redis__Ssl: "false"
  Redis__AbortConnect: "false"

externalSecret:
  enabled: true
  secretStoreRef:
    name: azure-keyvault-store
    kind: ClusterSecretStore
  data:
    - secretKey: ConnectionStrings__DefaultConnection
      remoteRef:
        key: aurora-document-ocr-db-connection
    - secretKey: RabbitMQ__Password
      remoteRef:
        key: rabbitmq-password
    - secretKey: Redis__Password
      remoteRef:
        key: redis-password

resources:
  requests:
    cpu: 25m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

serviceMonitor:
  enabled: true
  path: /metrics
  port: http

startupProbe:
  httpGet: null
  tcpSocket:
    port: 5000
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 36

livenessProbe:
  httpGet: null
  tcpSocket:
    port: 5000
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet: null
  tcpSocket:
    port: 5000
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 6

# Document OCR uses the filesystem provider for upload inputs and generated
# artifacts. The pod runs as UID 10001, so the image's /app directory cannot be
# used as a writable storage root without an explicitly mounted volume.
volumeMounts:
  - name: document-ocr-storage
    mountPath: /app/storage

volumes:
  - name: document-ocr-storage
    emptyDir: {}
