nameOverride: "admin-bff"
fullnameOverride: "admin-bff"

image:
  repository: acrauroracoredemo.azurecr.io/aurora/admin-bff
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

env:
  ASPNETCORE_ENVIRONMENT: "Production"
  Redis__Host: "redis-aurora-shared-demo.southeastasia.redis.azure.net:10000"
  Redis__Ssl: "true"
  Redis__AbortConnect: "false"
  Grpc__IamTenant__Url: "http://iam-tenant:5000"
  Grpc__ShipmentWorkflow__Url: "http://shipment-workflow:5000"
  Grpc__RoutePlanning__Url: "http://route-planning-agent.aurora-ai.svc.cluster.local:5000"
  Grpc__GpsTracking__Url: "http://gps-tracking:5000"
  Grpc__DocumentOcr__Url: "http://document-ocr.aurora-ai.svc.cluster.local:5000"
  Grpc__RegulatoryCompliance__Url: "http://regulatory-compliance.aurora-ai.svc.cluster.local:5000"
  Grpc__Notification__Url: "http://notification:5000"
  Grpc__MailService__Url: "http://mail-service:5003"
  Grpc__AiGovernance__Url: "http://ai-governance.aurora-ai.svc.cluster.local:9090"
  Grpc__CustomerAssistant__Url: "http://customer-assistant-service.aurora-ai.svc.cluster.local:5007"
  Grpc__NegotiationAgent__Url: "http://negotiation-agent-service.aurora-ai.svc.cluster.local:5006"
  Grpc__FinancialService__Url: "http://financial-service:5003"
  Grpc__BillingService__Url: "http://billing-service:5004"
  Grpc__AuditService__Url: "http://audit-service:9086"

externalSecret:
  enabled: true
  secretStoreRef:
    name: azure-keyvault-store
    kind: ClusterSecretStore
  data:
    - secretKey: Redis__Password
      remoteRef:
        key: redis-password
    - secretKey: Jwt__SecretKey
      remoteRef:
        key: bff-jwt-secret
    - secretKey: Grpc__Notification__ServiceApiKey
      remoteRef:
        key: notification-service-api-key

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

serviceMonitor:
  enabled: true
  path: /metrics
  port: http
