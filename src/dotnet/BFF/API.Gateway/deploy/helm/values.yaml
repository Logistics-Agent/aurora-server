nameOverride: "api-gateway"
fullnameOverride: "api-gateway"

image:
  repository: acrauroracoredemo.azurecr.io/aurora/api-gateway
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

env:
  ASPNETCORE_ENVIRONMENT: "Production"
  ReverseProxy__Clusters__staff-cluster__Destinations__staff-bff__Address: "http://staff-bff:8080"
  ReverseProxy__Clusters__admin-cluster__Destinations__admin-bff__Address: "http://admin-bff:8080"
  ReverseProxy__Clusters__system-cluster__Destinations__system-bff__Address: "http://system-bff:8080"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

serviceMonitor:
  enabled: true
  path: /metrics
  port: http
