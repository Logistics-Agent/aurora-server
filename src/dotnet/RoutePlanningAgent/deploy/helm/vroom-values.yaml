nameOverride: "vroom"
fullnameOverride: "vroom"

image:
  repository: ghcr.io/vroom-project/vroom-docker
  tag: "v1.14.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000
  targetPort: 3000

env:
  config.yml: |
    cliArgs:
      geometry: true
      planmode: false
      threads: 4
      explore: 5
      limit: '1mb'
      logdir: '/conf'
      logsize: '100M'
      maxlocations: 1000
      maxvehicles: 200
      override: true
      path: ''
      port: 3000
      router: 'osrm'
      timeout: 300000
      baseurl: '/'

    routingServers:
      osrm:
        car:
          host: 'osrm'
          port: '5000'

volumes:
  - name: vroom-config-vol
    configMap:
      name: vroom-config
      items:
        - key: config.yml
          path: config.yml

volumeMounts:
  - name: vroom-config-vol
    mountPath: /conf/config.yml
    subPath: config.yml

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 12

serviceMonitor:
  enabled: false

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

podSecurityContext:
  runAsNonRoot: false
  runAsUser: 0
  fsGroup: 0

securityContext:
  allowPrivilegeEscalation: true
  readOnlyRootFilesystem: false




