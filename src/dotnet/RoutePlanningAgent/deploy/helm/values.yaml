nameOverride: "route-planning-agent"
fullnameOverride: "route-planning-agent"

image:
  repository: acrauroracoredemo.azurecr.io/aurora/route-planning-agent
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 5000
  targetPort: 5000

env:
  ASPNETCORE_ENVIRONMENT: "Production"
  Redis__Host: "redis-aurora-shared-demo.southeastasia.redis.azure.net:10000"
  Redis__Ssl: "true"
  Redis__AbortConnect: "false"
  RabbitMQ__Host: "10.10.2.50" # Core Internal LoadBalancer over VNet Peering
  RabbitMQ__Port: "5672"
  RabbitMQ__Username: "aurora_admin"
  Osrm__BaseUrl: "http://osrm:5000"
  Vroom__BaseUrl: "http://vroom:3000"

externalSecret:
  enabled: true
  apiVersion: external-secrets.io/v1beta1
  secretStoreRef:
    name: azure-keyvault-store
    kind: ClusterSecretStore
  data:
    - secretKey: ConnectionStrings__DefaultConnection
      remoteRef:
        key: Routing-Planning-DB
    - secretKey: Redis__Password
      remoteRef:
        key: redis-password
    - secretKey: RabbitMQ__Password
      remoteRef:
        key: rabbitmq-password

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 512Mi

serviceMonitor:
  enabled: true
  path: /metrics
  port: http
