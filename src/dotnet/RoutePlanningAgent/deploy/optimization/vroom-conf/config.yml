# Cấu hình vroom-express: dùng OSRM làm routing engine
cliArgs:
  geometry: true    # bắt buộc để VROOM trả về distance (mét)
  planmode: false
  threads: 4
  explore: 5
  limit: '1mb'
  logdir: '/..'
  logsize: '100M'
  maxlocations: 1000
  maxvehicles: 200
  override: true
  path: ''
  port: 3000
  router: 'osrm'
  timeout: 300000
  baseurl: '/'

routingServers:
  osrm:
    car:
      host: 'osrm'   # tên service trong docker-compose
      port: '5000'
