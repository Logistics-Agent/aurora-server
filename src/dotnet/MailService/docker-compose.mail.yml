services:
  # ── Mail Platform Security & Integration Service ───────────────────────────
  mail-service:
    build:
      context: .
      dockerfile: src/dotnet/MailService/Dockerfile
    container_name: aurora-mail-service
    restart: unless-stopped
    expose:
      - "5003"
      - "9090"
    ports:
      # Expose metrics/health only to local host loopback for scraping
      - "127.0.0.1:9090:9090"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # External Managed Dependencies
      - ConnectionStrings__DefaultConnection=${NEON_DATABASE_URL}
      - AiGovernance__GrpcEndpoint=${AI_GOVERNANCE_GRPC_ENDPOINT}
      - R2__AccountId=${CF_ACCOUNT_ID}
      - R2__BucketName=${R2_BUCKET_NAME:-aurora-mail}
      - R2__AccessKey=${R2_ACCESS_KEY}
      - R2__SecretKey=${R2_SECRET_KEY}
      # Local Mini PC Stack Dependencies
      - Redis__ConnectionString=redis:6379,abortConnect=false
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__VirtualHost=${RABBITMQ_VHOST:-mail}
      - RabbitMQ__Username=${RABBITMQ_USER:-aurora}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:-aurora_dev}
      - Stalwart__BaseUrl=http://stalwart:8080
      - Stalwart__SmtpHost=stalwart
      - Stalwart__SmtpPort=25
      - Stalwart__AdminToken=${STALWART_ADMIN_TOKEN}
      - ClamAV__Host=clamav
      - ClamAV__Port=3310
      - SpamAssassin__Host=spamassassin
      - SpamAssassin__Port=783
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      clamav:
        condition: service_healthy
      stalwart:
        condition: service_healthy
      spamassassin:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9090/health/live"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - mail_internal

  # ── Stalwart All-in-One Mail Server ────────────────────────────────────────
  stalwart:
    image: stalwartlabs/mail-server:v0.10.8
    container_name: aurora-stalwart
    restart: unless-stopped
    ports:
      - "25:25"       # SMTP Inbound
      - "587:587"     # SMTP Submission
      - "993:993"     # IMAPS
      - "4190:4190"   # ManageSieve
      - "127.0.0.1:8080:8080" # Management API (loopback only)
    volumes:
      - stalwart_data:/opt/stalwart
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - mail_internal

  # ── RabbitMQ Message Broker ────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: aurora-mail-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-aurora}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-aurora_dev}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-mail}
    expose:
      - "5672"
    ports:
      # Management UI loopback only
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - mail_internal

  # ── Redis Cache & Rate Limiting ────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: aurora-mail-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - mail_internal

  # ── ClamAV Antivirus Daemon ────────────────────────────────────────────────
  clamav:
    image: clamav/clamav:1.4.1
    container_name: aurora-mail-clamav
    restart: unless-stopped
    expose:
      - "3310"
    volumes:
      - clamav_db:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - mail_internal

  # ── SpamAssassin Spam Scoring Daemon ───────────────────────────────────────
  spamassassin:
    image: instantlinux/spamassassin:3.4.6-1
    container_name: aurora-mail-spamassassin
    restart: unless-stopped
    expose:
      - "783"
    healthcheck:
      test: ["CMD-SHELL", "echo PING | nc -w2 localhost 783 | grep -q PONG || exit 0"]
      interval: 20s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - mail_internal

volumes:
  stalwart_data:
  rabbitmq_data:
  redis_data:
  clamav_db:

networks:
  mail_internal:
    driver: bridge
