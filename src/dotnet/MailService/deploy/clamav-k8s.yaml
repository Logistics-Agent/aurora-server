apiVersion: apps/v1
kind: Deployment
metadata:
  name: clamav
  namespace: aurora
  labels:
    app: clamav
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clamav
  template:
    metadata:
      labels:
        app: clamav
    spec:
      containers:
      - name: clamav
        image: clamav/clamav:stable
        ports:
        - containerPort: 3310
          name: clamd
        resources:
          requests:
            cpu: 100m
            memory: 1536Mi
          limits:
            cpu: 1000m
            memory: 2560Mi
        livenessProbe:
          tcpSocket:
            port: 3310
          initialDelaySeconds: 90
          periodSeconds: 20
          timeoutSeconds: 5
        readinessProbe:
          tcpSocket:
            port: 3310
          initialDelaySeconds: 45
          periodSeconds: 10
          timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: clamav
  namespace: aurora
  labels:
    app: clamav
spec:
  type: ClusterIP
  ports:
  - port: 3310
    targetPort: 3310
    name: clamd
    protocol: TCP
  selector:
    app: clamav
