nameOverride: "mail-service"
fullnameOverride: "mail-service"

image:
  repository: acrauroracorekhoa.azurecr.io/aurora/mail-service
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 5003
  targetPort: 5003
  name: grpc

additionalPorts:
  - name: http
    port: 9090
    targetPort: 9090
    protocol: TCP

livenessProbe:
  httpGet:
    path: /healthz
    port: 9090
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /healthz
    port: 9090
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 6

startupProbe:
  httpGet:
    path: /healthz
    port: 9090
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 36

env:
  ASPNETCORE_ENVIRONMENT: "Production"
  Redis__Host: "redis-master.aurora.svc.cluster.local:6379"
  Redis__Ssl: "false"
  Redis__AbortConnect: "false"
  Stalwart__BaseUrl: "http://stalwart.aurora.svc.cluster.local:8080"
  Stalwart__AdminUrl: "http://stalwart.aurora.svc.cluster.local:8080"
  Stalwart__SmtpHost: "stalwart.aurora.svc.cluster.local"
  Stalwart__SmtpPort: "25"
  AiGovernance__GrpcEndpoint: "http://10.20.2.10:9090"
  Grpc__AiGovernance__Url: "http://10.20.2.10:9090"
  ClamAV__Host: "clamav.aurora.svc.cluster.local"
  ClamAV__Port: "3310"
  SpamAssassin__Host: "spamassassin.aurora.svc.cluster.local"
  SpamAssassin__Port: "783"
  IamTenant__GrpcUrl: "http://iam-tenant:5000"
  RabbitMQ__Host: "rabbitmq.aurora.svc.cluster.local"
  RabbitMQ__Port: "5672"
  RabbitMQ__Username: "aurora_admin"

externalSecret:
  enabled: true
  secretStoreRef:
    name: azure-keyvault-store
    kind: ClusterSecretStore
  data:
    - secretKey: ConnectionStrings__DefaultConnection
      remoteRef:
        key: aurora-mail-db-connection
    - secretKey: Redis__Password
      remoteRef:
        key: redis-password
    - secretKey: Stalwart__AdminApiKey
      remoteRef:
        key: stalwart-admin-api-key
    - secretKey: RabbitMQ__Password
      remoteRef:
        key: rabbitmq-password

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

serviceMonitor:
  enabled: true
  path: /metrics
  port: http
