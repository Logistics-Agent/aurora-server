# ==============================================================================
# Aurora Mail Platform — Production Docker Compose (Mini PC Topology)
# Target OS: Ubuntu 24.04 LTS (linux-x64)
# Gate 6B: DEPLOYMENT-READY
# ==============================================================================

services:
  # ── Core Integration & Email Security Service ──────────────────────────────
  mail-service:
    image: ${MAIL_SERVICE_IMAGE:-ghcr.io/aurora/mail-service:1.0.0}
    container_name: aurora-mail-service
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    expose:
      - "5003"
      - "9090"
    ports:
      # Expose metrics/health strictly to local loopback (127.0.0.1) for scraper/monitoring
      - "127.0.0.1:9090:9090"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # External Managed Dependencies (Neon PostgreSQL + AI Governance + Cloudflare R2)
      - ConnectionStrings__DefaultConnection=${NEON_DATABASE_URL}
      - AiGovernance__GrpcEndpoint=${AI_GOVERNANCE_GRPC_ENDPOINT}
      - R2__AccountId=${CF_ACCOUNT_ID}
      - R2__BucketName=${R2_BUCKET_NAME:-aurora-mail-production}
      - R2__AccessKey=${R2_ACCESS_KEY}
      - R2__SecretKey=${R2_SECRET_KEY}
      # Local Mini PC Stack Dependencies
      - Redis__ConnectionString=redis:6379,abortConnect=false
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__VirtualHost=${RABBITMQ_VHOST:-mail}
      - RabbitMQ__Username=${RABBITMQ_USER:-aurora}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD}
      - Stalwart__BaseUrl=http://stalwart:8080
      - Stalwart__SmtpHost=stalwart
      - Stalwart__SmtpPort=25
      - Stalwart__AdminToken=${STALWART_ADMIN_TOKEN}
      - ClamAV__Host=clamav
      - ClamAV__Port=3310
      - SpamAssassin__Host=spamassassin
      - SpamAssassin__Port=783
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      clamav:
        condition: service_healthy
      stalwart:
        condition: service_healthy
      spamassassin:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9090/health/live"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - mail_internal

  # ── Stalwart All-in-One Mail Server ────────────────────────────────────────
  stalwart:
    image: stalwartlabs/mail-server:v0.10.8
    container_name: aurora-stalwart
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "25:25"               # Inbound SMTP from Internet
      - "587:587"             # Authenticated Submission (STARTTLS)
      - "993:993"             # IMAPS (TLS Mail Fetch)
      - "4190:4190"           # ManageSieve (Optional rule management)
      - "127.0.0.1:8080:8080" # Management REST API (strictly loopback)
    volumes:
      - stalwart_data:/opt/stalwart
      - /opt/aurora/mail/certs:/opt/stalwart/certs:ro
    environment:
      - STALWART_CONFIG=/opt/stalwart/config.toml
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 1536M
        reservations:
          cpus: '0.25'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - mail_internal

  # ── RabbitMQ Message Broker ────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: aurora-mail-rabbitmq
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-aurora}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-mail}
    expose:
      - "5672"
    ports:
      # Management Web UI restricted to loopback
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - mail_internal

  # ── Redis Cache & Rate Limiting ────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: aurora-mail-redis
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "384mb", "--maxmemory-policy", "volatile-lru"]
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - mail_internal

  # ── ClamAV Antivirus Daemon ────────────────────────────────────────────────
  clamav:
    image: clamav/clamav:1.4.1
    container_name: aurora-mail-clamav
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    expose:
      - "3310"
    volumes:
      - clamav_db:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 1536M
        reservations:
          cpus: '0.20'
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - mail_internal

  # ── SpamAssassin Spam Scoring Daemon ───────────────────────────────────────
  spamassassin:
    image: instantlinux/spamassassin:3.4.6-1
    container_name: aurora-mail-spamassassin
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    expose:
      - "783"
    healthcheck:
      test: ["CMD-SHELL", "echo PING | nc -w2 localhost 783 | grep -q PONG || exit 0"]
      interval: 20s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - mail_internal

volumes:
  stalwart_data:
  rabbitmq_data:
  redis_data:
  clamav_db:

networks:
  mail_internal:
    driver: bridge
