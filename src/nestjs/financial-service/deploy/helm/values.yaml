nameOverride: "financial-service"
fullnameOverride: "financial-service"

image:
  repository: acrauroracorekhoa.azurecr.io/aurora/financial-service
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 5003
  targetPort: 5003

additionalPorts:
  - name: http-metrics
    port: 8080
    targetPort: 8080
    protocol: TCP

env:
  NODE_ENV: "production"
  PORT: "8080"
  GRPC_PORT: "5003"
  REDIS_HOST: "redis-master.aurora.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_TLS: "false"

externalSecret:
  enabled: true
  secretStoreRef:
    name: azure-keyvault-store
    kind: ClusterSecretStore
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: DATABASE-URL-financial
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: redis-password

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

serviceMonitor:
  enabled: true
  path: /metrics
  port: http-metrics

startupProbe:
  httpGet: null
  tcpSocket:
    port: 5003
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 36

livenessProbe:
  httpGet: null
  tcpSocket:
    port: 5003
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet: null
  tcpSocket:
    port: 5003
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 6
