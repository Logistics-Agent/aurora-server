nameOverride: "financial-service"
fullnameOverride: "financial-service"

image:
  repository: acrauroracoredemo.azurecr.io/aurora/financial-service
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 5003
  targetPort: 5003

additionalPorts:
  - name: http-metrics
    port: 8080
    targetPort: 8080
    protocol: TCP

env:
  NODE_ENV: "production"
  PORT: "8080"
  GRPC_PORT: "5003"
  REDIS_HOST: "redis-aurora-shared-demo.southeastasia.redis.azure.net"
  REDIS_PORT: "10000"
  REDIS_TLS: "true"

externalSecret:
  enabled: true
  secretStoreRef:
    name: azure-keyvault-store
    kind: ClusterSecretStore
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: financial-service-db-url
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: redis-password

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

serviceMonitor:
  enabled: true
  path: /metrics
  port: http-metrics
