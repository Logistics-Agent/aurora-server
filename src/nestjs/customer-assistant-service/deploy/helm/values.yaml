nameOverride: "customer-assistant-service"
fullnameOverride: "customer-assistant-service"

image:
  repository: acrauroracorekhoa.azurecr.io/aurora/customer-assistant-service
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
    service.beta.kubernetes.io/azure-load-balancer-internal-subnet: "snet-aks-ai"
  loadBalancerIP: 10.20.2.14
  port: 8080
  targetPort: 8080
  name: http

additionalPorts: []

env:
  NODE_ENV: "production"
  PORT: "8080"
  REDIS_HOST: "redis-master.aurora.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_TLS: "false"
  REGULATORY_COMPLIANCE_GRPC_URL: "regulatory-compliance:5000"
  AI_GOVERNANCE_GRPC_URL: "ai-governance:9090"

externalSecret:
  enabled: true
  secretStoreRef:
    name: azure-keyvault-store
    kind: ClusterSecretStore
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: DATABASE-URL-customer-assistant
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: redis-password
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: openai-api-key

resources:
  requests:
    cpu: 25m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

serviceMonitor:
  enabled: true
  path: /metrics
  port: http

startupProbe:
  httpGet:
    path: /healthz/liveness
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 36

livenessProbe:
  httpGet:
    path: /healthz/liveness
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /healthz/readiness
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 6