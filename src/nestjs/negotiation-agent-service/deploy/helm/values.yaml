nameOverride: "negotiation-agent-service"
fullnameOverride: "negotiation-agent-service"

image:
  repository: acrauroracorekhoa.azurecr.io/aurora/negotiation-agent-service
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
    service.beta.kubernetes.io/azure-load-balancer-internal-subnet: "snet-aks-ai"
  loadBalancerIP: 10.20.2.15
  port: 8080
  targetPort: 8080
  name: grpc

additionalPorts:
  - name: http
    port: 3006
    targetPort: 3006
    protocol: TCP

env:
  NODE_ENV: "production"
  PORT: "8080"
  HTTP_PORT: "3006"
  GRPC_PORT: "8080"
  REDIS_HOST: "redis-master.aurora.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_TLS: "false"

externalSecret:
  enabled: true
  secretStoreRef:
    name: azure-keyvault-store
    kind: ClusterSecretStore
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: DATABASE-URL-negotiation-agent
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: redis-password
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: openai-api-key

resources:
  requests:
    cpu: 25m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

serviceMonitor:
  enabled: true
  path: /metrics
  port: http

startupProbe:
  httpGet:
    path: /healthz/liveness
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 36

livenessProbe:
  httpGet:
    path: /healthz/liveness
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /healthz/readiness
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 6
