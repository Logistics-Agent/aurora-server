nameOverride: "billing-service"
fullnameOverride: "billing-service"

image:
  repository: acrauroracorekhoa.azurecr.io/aurora/billing-service
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 5004
  targetPort: 5004
  name: grpc

additionalPorts:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP

env:
  NODE_ENV: "production"
  PORT: "8080"
  GRPC_PORT: "5004"
  SHIPMENT_WORKFLOW_GRPC_URL: "shipment-workflow:5000"
  REDIS_HOST: "redis-master.aurora.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_TLS: "false"
  RABBITMQ_HOST: "rabbitmq.aurora.svc.cluster.local"
  RABBITMQ_PORT: "5672"
  RABBITMQ_USERNAME: "aurora_admin"

externalSecret:
  enabled: true
  secretStoreRef:
    name: azure-keyvault-store
    kind: ClusterSecretStore
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: DATABASE-URL-billing
    - secretKey: INTERNAL_SERVICE_SECRET
      remoteRef:
        key: customer-assistant-internal-service-secret
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: redis-password
    - secretKey: RABBITMQ_PASSWORD
      remoteRef:
        key: rabbitmq-password

resources:
  requests:
    cpu: 25m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

serviceMonitor:
  enabled: true
  path: /metrics
  port: http

startupProbe:
  httpGet: null
  tcpSocket:
    port: grpc
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 36

livenessProbe:
  httpGet: null
  tcpSocket:
    port: grpc
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet: null
  tcpSocket:
    port: grpc
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 6
