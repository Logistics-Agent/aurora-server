nameOverride: "billing-service"
fullnameOverride: "billing-service"

image:
  repository: acrauroracoredemo.azurecr.io/aurora/billing-service
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 5004
  targetPort: 5004
  name: grpc

additionalPorts:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP

env:
  NODE_ENV: "production"
  PORT: "8080"
  GRPC_PORT: "5004"
  REDIS_HOST: "redis-aurora-shared-demo.southeastasia.redis.azure.net"
  REDIS_PORT: "10000"
  REDIS_TLS: "true"

externalSecret:
  enabled: true
  apiVersion: external-secrets.io/v1
  secretStoreRef:
    name: azure-keyvault-store
    kind: ClusterSecretStore
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: DATABASE-URL-billing
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: redis-password

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

serviceMonitor:
  enabled: true
  path: /metrics
  port: http

startupProbe:
  httpGet: null
  tcpSocket:
    port: grpc
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 36

livenessProbe:
  httpGet: null
  tcpSocket:
    port: grpc
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet: null
  tcpSocket:
    port: grpc
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 6