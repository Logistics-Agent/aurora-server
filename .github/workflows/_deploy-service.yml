name: Reusable Deploy to AKS

on:
  workflow_call:
    inputs:
      service-name:
        description: 'Logical service name'
        required: true
        type: string
      service-path:
        description: 'Optional path to service root (for initial helm install)'
        required: false
        type: string
      deploy-target:
        description: 'Deploy target cluster (core | ai)'
        required: true
        type: string
      namespace:
        description: 'Target Kubernetes namespace'
        required: true
        type: string
      image-tag:
        description: 'Image tag to deploy (Git Commit SHA)'
        required: true
        type: string
      deployment-name:
        description: 'Optional deployment name if different from service-name'
        required: false
        type: string
      container-name:
        description: 'Optional container name if different from service-name'
        required: false
        type: string
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_CORE:
        required: true
      AZURE_SUBSCRIPTION_AI:
        required: true
      ACR_LOGIN_SERVER:
        required: false
      AKS_CORE_CLUSTER:
        required: false
      AKS_CORE_RG:
        required: false
      AKS_AI_CLUSTER:
        required: false
      AKS_AI_RG:
        required: false

jobs:
  deploy:
    name: Rollout (${{ inputs.service-name }} -> AKS ${{ inputs.deploy-target }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Azure Environment Variables
        id: env
        run: |
          if [ "${{ inputs.deploy-target }}" = "ai" ]; then
            SUB_ID="${{ secrets.AZURE_SUBSCRIPTION_AI }}"
            CLUSTER="${{ secrets.AKS_AI_CLUSTER }}"
            [ -z "$CLUSTER" ] && CLUSTER="${{ vars.AKS_AI_CLUSTER }}"
            [ -z "$CLUSTER" ] && CLUSTER="aks-ai-demo"

            RG="${{ secrets.AKS_AI_RG }}"
            [ -z "$RG" ] && RG="${{ vars.AKS_AI_RG }}"
            [ -z "$RG" ] && RG="rg-aurora-ai-demo"
          else
            SUB_ID="${{ secrets.AZURE_SUBSCRIPTION_CORE }}"
            CLUSTER="${{ secrets.AKS_CORE_CLUSTER }}"
            [ -z "$CLUSTER" ] && CLUSTER="${{ vars.AKS_CORE_CLUSTER }}"
            [ -z "$CLUSTER" ] && CLUSTER="aks-core-demo"

            RG="${{ secrets.AKS_CORE_RG }}"
            [ -z "$RG" ] && RG="${{ vars.AKS_CORE_RG }}"
            [ -z "$RG" ] && RG="rg-aurora-core-demo"
          fi

          ACR_SERVER="${{ secrets.ACR_LOGIN_SERVER }}"
          [ -z "$ACR_SERVER" ] && ACR_SERVER="${{ vars.ACR_LOGIN_SERVER }}"
          [ -z "$ACR_SERVER" ] && ACR_SERVER="acrauroracoredemo.azurecr.io"

          echo "sub_id=$SUB_ID" >> $GITHUB_OUTPUT
          echo "cluster_name=$CLUSTER" >> $GITHUB_OUTPUT
          echo "rg_name=$RG" >> $GITHUB_OUTPUT
          echo "acr_server=$ACR_SERVER" >> $GITHUB_OUTPUT

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ steps.env.outputs.sub_id }}

      - name: Get AKS Cluster Credentials
        run: |
          az aks get-credentials \
            --resource-group "${{ steps.env.outputs.rg_name }}" \
            --name "${{ steps.env.outputs.cluster_name }}" \
            --overwrite-existing

      - name: Deploy or Update Deployment on Kubernetes
        run: |
          DEPLOYMENT_NAME="${{ inputs.deployment-name || inputs.service-name }}"
          CONTAINER_NAME="${{ inputs.container-name || inputs.service-name }}"
          IMAGE_URI="${{ steps.env.outputs.acr_server }}/aurora/${{ inputs.service-name }}:${{ inputs.image-tag }}"

          echo "Target Namespace:  ${{ inputs.namespace }}"
          echo "Target Deployment: $DEPLOYMENT_NAME"
          echo "Target Container:  $CONTAINER_NAME"
          echo "New Image URI:     $IMAGE_URI"
          VALUES_FILE="${{ inputs.service-path }}/deploy/helm/values.yaml"
          if [ -f "$VALUES_FILE" ]; then
            echo "Validating Helm template schema..."
          helm template "$DEPLOYMENT_NAME" infra/helm/aurora-service \
          --namespace "${{ inputs.namespace }}" \
          -f "$VALUES_FILE" \
          --set image.tag="${{ inputs.image-tag }}" \
          --set image.repository="${{ steps.env.outputs.acr_server }}/aurora/${{ inputs.service-name }}" \
          | kubectl apply --dry-run=server -f -

            echo "Installing/Upgrading via Helm chart..."
            helm upgrade --install "$DEPLOYMENT_NAME" infra/helm/aurora-service \
              --namespace "${{ inputs.namespace }}" \
              --create-namespace \
              -f "$VALUES_FILE" \
              --set image.tag="${{ inputs.image-tag }}" \
              --set image.repository="${{ steps.env.outputs.acr_server }}/aurora/${{ inputs.service-name }}"
          else
            echo "No Helm values found at $VALUES_FILE, checking existing deployment..."
            if kubectl get deployment "$DEPLOYMENT_NAME" -n "${{ inputs.namespace }}" >/dev/null 2>&1; then
              echo "Deployment $DEPLOYMENT_NAME exists. Updating image via kubectl set image..."
              kubectl set image "deployment/$DEPLOYMENT_NAME" "$CONTAINER_NAME=$IMAGE_URI" -n "${{ inputs.namespace }}" || \
              kubectl set image "deployment/$DEPLOYMENT_NAME" "aurora-service=$IMAGE_URI" -n "${{ inputs.namespace }}"
            else
              echo "Deployment $DEPLOYMENT_NAME not found, creating deployment..."
              kubectl create deployment "$DEPLOYMENT_NAME" --image="$IMAGE_URI" -n "${{ inputs.namespace }}"
            fi
          fi

          - name: Quick Pod Health Check
            shell: bash
            run: |
              DEPLOYMENT_NAME="${{ inputs.deployment-name || inputs.service-name }}"
              NAMESPACE="${{ inputs.namespace }}"

              sleep 20

              kubectl get pods \
                -n "$NAMESPACE" \
                -l "app.kubernetes.io/name=$DEPLOYMENT_NAME" \
                -o wide

              BAD=$(kubectl get pods \
                -n "$NAMESPACE" \
                -l "app.kubernetes.io/name=$DEPLOYMENT_NAME" \
                -o jsonpath='{range .items[*]}{.status.containerStatuses[*].state.waiting.reason}{"\n"}{end}' |
                grep -E 'CrashLoopBackOff|CreateContainerConfigError|ImagePullBackOff|ErrImagePull' || true)

              if [ -n "$BAD" ]; then
                echo "Pod entered fatal state early:"
                echo "$BAD"

                kubectl get events \
                  -n "$NAMESPACE" \
                  --sort-by=.lastTimestamp |
                  tail -50 || true

                exit 1
              fi

      - name: Await Rollout Completion
        shell: bash
        run: |
          set -o pipefail

          DEPLOYMENT_NAME="${{ inputs.deployment-name || inputs.service-name }}"
          NAMESPACE="${{ inputs.namespace }}"

          echo "Waiting for deployment: $DEPLOYMENT_NAME"

          if kubectl rollout status \
            "deployment/$DEPLOYMENT_NAME" \
            -n "$NAMESPACE" \
            --timeout=300s; then

            echo "Rollout completed successfully."
            exit 0
          fi

          echo ""
          echo "=========================================="
          echo "ROLLOUT FAILED: $DEPLOYMENT_NAME"
          echo "=========================================="

          echo ""
          echo "=== DEPLOYMENT STATUS ==="
          kubectl get deployment "$DEPLOYMENT_NAME" \
            -n "$NAMESPACE" \
            -o wide || true

          echo ""
          echo "=== REPLICASETS ==="
          kubectl get rs \
            -n "$NAMESPACE" \
            -l "app.kubernetes.io/name=$DEPLOYMENT_NAME" \
            -o wide || true

          echo ""
          echo "=== PODS ==="
          kubectl get pods \
            -n "$NAMESPACE" \
            -l "app.kubernetes.io/name=$DEPLOYMENT_NAME" \
            -o wide || true

          echo ""
          echo "=== RECENT EVENTS ==="
          kubectl get events \
            -n "$NAMESPACE" \
            --sort-by=.lastTimestamp |
            tail -100 || true

          PODS=$(kubectl get pods \
            -n "$NAMESPACE" \
            -l "app.kubernetes.io/name=$DEPLOYMENT_NAME" \
            -o jsonpath='{.items[*].metadata.name}' 2>/dev/null || true)

          for POD in $PODS; do
            echo ""
            echo "=========================================="
            echo "POD: $POD"
            echo "=========================================="

            echo ""
            echo "=== POD DESCRIPTION ==="
            kubectl describe pod "$POD" \
              -n "$NAMESPACE" || true

            echo ""
            echo "=== CURRENT LOGS ==="
            kubectl logs "$POD" \
              -n "$NAMESPACE" \
              --all-containers=true \
              --tail=200 || true

            echo ""
            echo "=== PREVIOUS LOGS ==="
            kubectl logs "$POD" \
              -n "$NAMESPACE" \
              --all-containers=true \
              --previous \
              --tail=200 || true
          done

          exit 1
