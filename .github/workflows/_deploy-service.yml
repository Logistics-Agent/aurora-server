name: Reusable Deploy to AKS

on:
  workflow_call:
    inputs:
      service-name:
        description: 'Logical service name'
        required: true
        type: string
      deploy-target:
        description: 'Deploy target cluster (core | ai)'
        required: true
        type: string
      namespace:
        description: 'Target Kubernetes namespace'
        required: true
        type: string
      image-tag:
        description: 'Image tag to deploy (Git Commit SHA)'
        required: true
        type: string
      deployment-name:
        description: 'Optional deployment name if different from service-name'
        required: false
        type: string
      container-name:
        description: 'Optional container name if different from service-name'
        required: false
        type: string
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_CORE:
        required: true
      AZURE_SUBSCRIPTION_AI:
        required: true

jobs:
  deploy:
    name: Rollout (${{ inputs.service-name }} -> AKS ${{ inputs.deploy-target }})
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Azure Environment Variables
        id: env
        run: |
          if [ "${{ inputs.deploy-target }}" = "ai" ]; then
            echo "sub_id=${{ secrets.AZURE_SUBSCRIPTION_AI }}" >> $GITHUB_OUTPUT
            echo "cluster_name=${{ secrets.AKS_AI_CLUSTER || vars.AKS_AI_CLUSTER || 'aks-ai-demo' }}" >> $GITHUB_OUTPUT
            echo "rg_name=${{ secrets.AKS_AI_RG || vars.AKS_AI_RG || 'rg-aurora-ai-demo' }}" >> $GITHUB_OUTPUT
          else
            echo "sub_id=${{ secrets.AZURE_SUBSCRIPTION_CORE }}" >> $GITHUB_OUTPUT
            echo "cluster_name=${{ secrets.AKS_CORE_CLUSTER || vars.AKS_CORE_CLUSTER || 'aks-core-demo' }}" >> $GITHUB_OUTPUT
            echo "rg_name=${{ secrets.AKS_CORE_RG || vars.AKS_CORE_RG || 'rg-aurora-core-demo' }}" >> $GITHUB_OUTPUT
          fi

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ steps.env.outputs.sub_id }}

      - name: Get AKS Cluster Credentials
        run: |
          az aks get-credentials \
            --resource-group "${{ steps.env.outputs.rg_name }}" \
            --name "${{ steps.env.outputs.cluster_name }}" \
            --overwrite-existing

      - name: Update Deployment Image on Kubernetes
        run: |
          DEPLOYMENT_NAME="${{ inputs.deployment-name || inputs.service-name }}"
          CONTAINER_NAME="${{ inputs.container-name || inputs.service-name }}"
          IMAGE_URI="${{ secrets.ACR_LOGIN_SERVER || vars.ACR_LOGIN_SERVER || 'acrauroracoredemo.azurecr.io' }}/aurora/${{ inputs.service-name }}:${{ inputs.image-tag }}"

          echo "Target Namespace:  ${{ inputs.namespace }}"
          echo "Target Deployment: $DEPLOYMENT_NAME"
          echo "Target Container:  $CONTAINER_NAME"
          echo "New Image URI:     $IMAGE_URI"

          kubectl set image "deployment/$DEPLOYMENT_NAME" "$CONTAINER_NAME=$IMAGE_URI" -n "${{ inputs.namespace }}"

      - name: Await Rollout Completion
        run: |
          DEPLOYMENT_NAME="${{ inputs.deployment-name || inputs.service-name }}"
          kubectl rollout status "deployment/$DEPLOYMENT_NAME" -n "${{ inputs.namespace }}" --timeout=300s

