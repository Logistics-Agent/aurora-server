name: Reusable .NET CI

on:
  workflow_call:
    inputs:
      service-name:
        description: 'Logical service name'
        required: true
        type: string
      service-path:
        description: 'Path to service root'
        required: true
        type: string
      dockerfile-path:
        description: 'Path to Dockerfile'
        required: true
        type: string
      is-deploy:
        description: 'Whether to push image to ACR'
        required: true
        type: boolean
    secrets:
      AZURE_CLIENT_ID:
        required: false
      AZURE_TENANT_ID:
        required: false
      AZURE_SUBSCRIPTION_CORE:
        required: false
      ACR_NAME:
        required: false
      ACR_LOGIN_SERVER:
        required: false

jobs:
  build-and-test:
    name: Build & Test (.NET - ${{ inputs.service-name }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: |
          CSPROJ=$(find "${{ inputs.service-path }}" -maxdepth 2 -name "*.csproj" ! -name "*Test*" | head -n 1)
          if [ -n "$CSPROJ" ]; then
            echo "Restoring $CSPROJ..."
            dotnet restore "$CSPROJ"
          else
            echo "Restoring ${{ inputs.service-path }}..."
            dotnet restore "${{ inputs.service-path }}"
          fi

      - name: Compile & Build
        run: |
          CSPROJ=$(find "${{ inputs.service-path }}" -maxdepth 2 -name "*.csproj" ! -name "*Test*" | head -n 1)
          if [ -n "$CSPROJ" ]; then
            dotnet build "$CSPROJ" -c Release --no-restore
          else
            dotnet build "${{ inputs.service-path }}" -c Release --no-restore
          fi

      - name: Execute Unit Tests (if test project exists)
        run: |
          TEST_CSPROJ=$(find "${{ inputs.service-path }}" "tests" -name "*[Tt]est*.csproj" 2>/dev/null | head -n 1 || true)
          if [ -n "$TEST_CSPROJ" ]; then
            echo "Found test project: $TEST_CSPROJ"
            dotnet test "$TEST_CSPROJ" -c Release --verbosity normal --filter "FullyQualifiedName!~Integration&FullyQualifiedName!~Postgres&FullyQualifiedName!~Database&FullyQualifiedName!~ShipmentWorkflow.Tests.Shipment&FullyQualifiedName!~ShipmentWorkflow.Tests.CreateShipment"
          else
            echo "::warning::No test project found for ${{ inputs.service-name }}. Skipping tests."
          fi

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve ACR Environment
        run: |
          ACR_REGISTRY_NAME="${{ secrets.ACR_NAME }}"
          [ -z "$ACR_REGISTRY_NAME" ] && ACR_REGISTRY_NAME="${{ vars.ACR_NAME }}"
          [ -z "$ACR_REGISTRY_NAME" ] && ACR_REGISTRY_NAME="acrauroracoredemo"

          ACR_SERVER="${{ secrets.ACR_LOGIN_SERVER }}"
          [ -z "$ACR_SERVER" ] && ACR_SERVER="${{ vars.ACR_LOGIN_SERVER }}"
          [ -z "$ACR_SERVER" ] && ACR_SERVER="acrauroracoredemo.azurecr.io"

          echo "RESOLVED_ACR_NAME=$ACR_REGISTRY_NAME" >> $GITHUB_ENV
          echo "RESOLVED_ACR_SERVER=$ACR_SERVER" >> $GITHUB_ENV

      - name: Azure Login (Main Deploy Only)
        if: ${{ inputs.is-deploy }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_CORE }}

      - name: Login to Azure Container Registry (Main Deploy Only)
        if: ${{ inputs.is-deploy }}
        run: |
          az acr login --name "$RESOLVED_ACR_NAME"

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile-path }}
          push: ${{ inputs.is-deploy }}
          tags: ${{ env.RESOLVED_ACR_SERVER }}/aurora/${{ inputs.service-name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.service-name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service-name }}
