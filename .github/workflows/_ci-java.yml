name: Reusable Java CI

on:
  workflow_call:
    inputs:
      service-name:
        description: 'Logical service name'
        required: true
        type: string
      service-path:
        description: 'Path to service root'
        required: true
        type: string
      dockerfile-path:
        description: 'Path to Dockerfile'
        required: true
        type: string
      java-version:
        description: 'Java version (17 | 21)'
        required: false
        default: '21'
        type: string
      is-deploy:
        description: 'Whether to push image to ACR'
        required: true
        type: boolean
    secrets:
      AZURE_CLIENT_ID:
        required: false
      AZURE_TENANT_ID:
        required: false
      AZURE_SUBSCRIPTION_CORE:
        required: false
      ACR_NAME:
        required: false
      ACR_LOGIN_SERVER:
        required: false

jobs:
  build-and-test:
    name: Build & Test (Java ${{ inputs.java-version }} - ${{ inputs.service-name }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java JDK ${{ inputs.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ inputs.java-version }}

      - name: Cache Maven Packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ inputs.service-name }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-${{ inputs.service-name }}-
            ${{ runner.os }}-maven-

      - name: Build Java Shared Library (if needed)
        run: |
          if [ -f "src/java/shared/pom.xml" ] && grep -q "aurora-java-shared" "${{ inputs.service-path }}/pom.xml" 2>/dev/null; then
            echo "Service depends on aurora-java-shared. Installing shared library..."
            mvn -B clean install -f src/java/shared/pom.xml -DskipTests
          else
            echo "Shared library not needed or service does not depend on it. Skipping."
          fi

      - name: Compile & Execute Tests
        run: |
          echo "Building and testing ${{ inputs.service-name }}..."
          mvn -B clean verify -f "${{ inputs.service-path }}/pom.xml"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve ACR Environment
        run: |
          ACR_REGISTRY_NAME="${{ secrets.ACR_NAME }}"
          [ -z "$ACR_REGISTRY_NAME" ] && ACR_REGISTRY_NAME="${{ vars.ACR_NAME }}"
          [ -z "$ACR_REGISTRY_NAME" ] && ACR_REGISTRY_NAME="acrauroracoredemo"

          ACR_SERVER="${{ secrets.ACR_LOGIN_SERVER }}"
          [ -z "$ACR_SERVER" ] && ACR_SERVER="${{ vars.ACR_LOGIN_SERVER }}"
          [ -z "$ACR_SERVER" ] && ACR_SERVER="acrauroracoredemo.azurecr.io"

          echo "RESOLVED_ACR_NAME=$ACR_REGISTRY_NAME" >> $GITHUB_ENV
          echo "RESOLVED_ACR_SERVER=$ACR_SERVER" >> $GITHUB_ENV

      - name: Azure Login (Main Deploy Only)
        if: ${{ inputs.is-deploy }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_CORE }}

      - name: Login to Azure Container Registry (Main Deploy Only)
        if: ${{ inputs.is-deploy }}
        run: |
          az acr login --name "$RESOLVED_ACR_NAME"

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile-path }}
          push: ${{ inputs.is-deploy }}
          tags: ${{ env.RESOLVED_ACR_SERVER }}/aurora/${{ inputs.service-name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.service-name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service-name }}
