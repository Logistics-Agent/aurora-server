name: Deploy Aurora Mail Platform (Mini PC)

on:
  push:
    branches:
      - main
    paths:
      - 'src/dotnet/MailService/**'
      - 'src/dotnet/shared/**'
      - 'protos/mail_platform.proto'
      - 'protos/common.proto'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deployment'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/mail-service

jobs:
  test-and-build:
    name: Test, Build & Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install EF Core CLI Tools
        run: dotnet tool install --global dotnet-ef || true

      - name: Restore dependencies
        run: dotnet restore src/dotnet/MailService/MailService.csproj

      - name: Run Test Suite
        run: dotnet test tests/dotnet/MailService.Tests/MailService.Tests.csproj -c Release --verbosity normal

      - name: Generate Linux x64 EF Migration Bundle
        run: |
          mkdir -p bin
          dotnet ef migrations bundle \
            --project src/dotnet/MailService/MailService.csproj \
            --startup-project src/dotnet/MailService/MailService.csproj \
            -o bin/efbundle \
            --self-contained -r linux-x64 --force

      - name: Upload Migration Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: efbundle-linux-x64
          path: bin/efbundle

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/dotnet/MailService/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-minipc:
    name: Deploy to Production Mini PC
    needs: test-and-build
    runs-on: [self-hosted, minipc-production]
    environment: production
    steps:
      - name: Download Migration Bundle
        uses: actions/download-artifact@v4
        with:
          name: efbundle-linux-x64
          path: /opt/aurora/mail/bin/

      - name: Make efbundle executable
        run: chmod +x /opt/aurora/mail/bin/efbundle

      - name: Update Pinned Image Tag in Production Config
        run: |
          sed -i "s|MAIL_SERVICE_IMAGE=.*|MAIL_SERVICE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}|g" /opt/aurora/mail/.env.prod

      - name: Run Health-Gated Deployment
        run: |
          cd /opt/aurora/mail
          bash scripts/deploy.sh

      - name: Execute Production Smoke Tests
        run: |
          cd /opt/aurora/mail
          bash scripts/production-smoke-test.sh
